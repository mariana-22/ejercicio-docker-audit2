name: CI/CD

on:
  push:
    branches: ["main", "feature/vulnerabilidades"]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        required: false
        default: 'main'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Ejecutar pruebas pytest
        run: pytest test_app.py -v

      - name: Escaneo de seguridad (Bandit - solo falla en High)
        run: bandit -r app.py test_app.py -lll

  docker-scan:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t tecnova-web:ci .

      - name: Escanear imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tecnova-web:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          scanners: vuln
          trivyignores: .trivyignore

      - name: Escanear filesystem con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  deploy:
    needs: docker-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "=== Paso 1: Verificar/instalar git ==="
            which git || (sudo apt-get update && sudo apt-get install -y git)
            echo "=== Paso 2: Clonar repo si no existe ==="
            if [ ! -d ~/ejercicio_docker-audit2-web ]; then
              echo "Clonando repositorio..."
              git clone https://github.com/mariana-22/ejercicio-docker-audit2.git ~/ejercicio_docker-audit2-web
            else
              echo "Carpeta ya existe, actualizando..."
              cd ~/ejercicio_docker-audit2-web && git pull
            fi
            echo "=== Paso 3: Instalar docker compose plugin ==="
            if ! docker compose version >/dev/null 2>&1; then
              echo "docker compose no encontrado, instalando desde repositorio oficial de Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -d -m 0755 /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi
echo "=== Paso 4: Pull de imagen y deploy ==="
            cd ~/ejercicio_docker-audit2-web
            docker compose pull app-backend
            docker compose down
            docker compose up -d --remove-orphans
            echo "=== Deploy completado ==="
