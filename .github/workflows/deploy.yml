      - name: Instalar herramientas de análisis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Ejecutar pip-audit
        run: |
          pip-audit --progress=None --fail-on

      - name: Construir imagen Docker
        run: docker build -t apilegacy-web:${{ github.sha }} .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: apilegacy-web:${{ github.sha }}
          format: table
          exit-code: '1'            # mantener, queremos bloquear CVE CRÍTICOS/ALTOS
          severity: CRITICAL,HIGH
          cache-dir: .cache/trivy