  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: mariana220308/sample-api:v1

      - name: Escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "mariana220308/sample-api:v1"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          scanners: vuln
          trivyignores: .trivyignore

      - name: Subir la imagen a Docker Hub
        run: docker push mariana220308/sample-api:v1

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/ejercicio-docker-audit2-web
            docker compose pull app-backend
            docker compose up -d