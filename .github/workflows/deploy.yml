name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Ejecutar pytest
        run: pytest test_app.py -v

      - name: Ejecutar Bandit
        run: bandit -r app.py test_app.py

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t apilegacy-web:${{ github.sha }} .  

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: apilegacy-web:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          extra-args: --ignorefile .trivyignore --pkg-types library